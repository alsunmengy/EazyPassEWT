name: Update star history

on:
  schedule:
    - cron: '0 0 * * 0'        # 每周日 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_chart.py "$GITHUB_REPOSITORY" "#2DA44E" .github/star-history/chart.svg

      - name: Commit chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/star-history/chart.svg
          git diff --cached --quiet || git commit -m 'chore: update star history'
          git push
